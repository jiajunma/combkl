    reflection-faithful realization and uses the dihedral character calculation to
    identify the rank-one model.
  lean: The direct construction first proves parity matching in arbitrary lower Bruhat
    intervals by a simple-reflection involution. In the dihedral application, orbit-spline
    factors supply the prescribed values and zeros; their product gives flow-down
    sections. A finite induction on prescribed upper sets proves flabbiness, while
    generation and quotient maps follow from the structure-sheaf construction.
  consequence: The Blueprint follows the parity, normal-form prescription, spline
    product and flow-down correction arguments. Injectivity of the reflection-preserving
    group map provides distinct factor data and pairwise relatively prime incident
    labels. These model properties feed the later local-ring decomposition.
