authority: Lean is primary when sources differ
comparisons:
- id: character-normalization
  kind: Different intermediate statement
  nodes:
  - kl.duality.character_identity_condition
  - kl.duality.actual_character_reciprocity
  - kl.detail.costalk_reciprocity
  - kl.detail.local_diagonal_degree
  - kl.detail.local_intersection
  paper_labels:
  - bg:normalization
  lean_declarations:
  - OAI.KLInvariance.BruhatGraph.StalkCharacterObligation
  - OAI.KLInvariance.BruhatGraph.stalkCharacter_reciprocity
  - OAI.KLInvariance.BruhatGraph.localIntersection_diagonal_strict_degree
  paper: The grading-normalization proposition identifies the stalk graded rank with
    the canonical KL polynomial and uses the Elias–Williamson character theorem through
    the cited moment-graph bridges.
  lean: The development defines the equality of actual stalk characters and canonical
    KL polynomials as StalkCharacterObligation. The unconditional theorem used in
    the main route is R-reciprocity for the actual character. The local strict half-degree
    implication retains an explicit nonzero-diagonal hypothesis.
  consequence: The comparison uses the actual character C and its proved R-reciprocity.
    Canonical P is handled by the later polynomial-rigidity induction. The local degree
    result applies to a diagonal coefficient satisfying its stated nonvanishing hypothesis.
- id: r-first-induction
  kind: Different proof route
  nodes:
  - kl.comparison.global_comparison
  - kl.comparison.rtilde_row_comparison
  - kl.comparison.rtilde_step
  - kl.comparison.rtilde_invariance
  - kl.detail.endpoint_equality
  - kl.main.kl_finite
  - kl.main.combinatorial_invariance
  paper_labels:
  - sec:induction
  - eq:comparison
  - eq:reciprocal-vector
  lean_declarations:
  - OAI.KLInvariance.BruhatGraph.rTilde_freeness_of_below
  - OAI.KLInvariance.BruhatGraph.rTilde_invariance_and_freeness
  - OAI.KLInvariance.BruhatGraph.klPolynomial_invariance_finite
  paper: The simultaneous induction compares normalized KL vectors, obtains P-invariance
    from the strict half-degree bound, and then recovers bottom terminal-kernel freeness
    from endpoint equality.
  lean: The simultaneous induction first proves normalized R-invariance together with
    suffix-kernel freeness in both transported directions. It cancels known bottom
    R-row entries against one actual source-character vector. Canonical KL equality
    is proved afterwards in a separate induction using the now common R-matrix and
    the canonical degree bound.
  consequence: Proper upper intervals supply kernel freeness, and proper initial intervals
    supply known R-entries. The new R-equality gives exact endpoints and then current-rank
    suffix freeness. The canonical degree bound enters the subsequent P-induction.
- id: reflection-faithfulness
  kind: Same conclusion, different proof
  nodes:
  - kl.notes.reflection_faithfulness
  paper_labels:
  - bg:realization
  lean_declarations:
  - OAI.KLInvariance.TitsSpace.isReflection_of_moving_rank_one
  - OAI.KLInvariance.TitsSpace.reflectionFaithful
  paper: After showing a rank-one orthogonal change is an involution, the proof invokes
    the finite-subgroup theorem to conjugate it into a finite standard parabolic subgroup.
  lean: 'The converse is proved by descent in Coxeter length: an involution with a
    simple descent is either that commuting simple reflection or has a shorter simple
    conjugate with the same moving rank.'
  consequence: The proof below follows length descent. Its shorter conjugate preserves
    moving rank, and its commuting case identifies the element with the chosen simple
    reflection.
- id: r-construction
  kind: Same polynomial, different construction order
  nodes:
  - kl.detail.rtilde_family
  - kl.detail.rtilde_recursion
  - kl.foundations.rtilde
  - kl.paths.dyer_paths
  paper_labels:
  - bg:paths
  - eq:bg-path-formula
  lean_declarations:
  - OAI.KLInvariance.Hecke.rTilde
  - OAI.KLInvariance.Hecke.rTilde_recursion
  - OAI.KLInvariance.WallDyer.geometric_entry_eq_rTilde
  paper: The path-formula theorem introduces the normalized R-polynomial through increasing
    reflection paths and relates it to the ordinary R-polynomial; decreasing paths
    follow by reversing the reflection order.
  lean: The normalized R-family is defined first as a coefficient of the Hecke bar
    transform. Its recursion is proved algebraically, and the geometric path product
    is later proved equal to that independently constructed family.
  consequence: The bar construction supplies the R-family and its recursion. The path
    theorem then identifies that family with the ordered path polynomial.
- id: geometric-order-scope
  kind: Different stated generality
  nodes:
  - kl.paths.dyer_paths
  - kl.detail.geometric_functional
  paper_labels:
  - bg:paths
  lean_declarations:
  - OAI.KLInvariance.TitsSpace.exists_geometric_functional
  - OAI.KLInvariance.WallDyer.geometric_entry_eq_rTilde
  paper: The cited Dyer theorem is stated for a reflection order in general; the subsequent
    comparison chooses geometric reflection orders.
  lean: The referenced formal entry theorem establishes the required path formula
    for the constructed geometric functional on a finite lower region of a finite-generator
    system. Generic pencils and complete root-plane blocks provide its order-independence
    argument.
  consequence: The geometric-order hypotheses specify the path theorem used here.
    The generic-functional construction orders all positive roots; the transfer calculation
    takes place on the finite region in the theorem.
- id: dihedral-kl-identification
  kind: Same conclusion, different final identification
  nodes:
  - kl.notes.dihedral_kl
  paper_labels:
  - loc:dihedral-kl
  lean_declarations:
  - OAI.KLInvariance.Dihedral.bar_lowerSum
  - OAI.KLInvariance.Dihedral.rPolynomial_sum
  - OAI.KLInvariance.Dihedral.constant_normalizedKL
  - OAI.KLInvariance.Dihedral.klPolynomial_eq_one
  paper: After the lower-interval Hecke sum is shown bar invariant, the proof identifies
    it by the triangular characterization of the KL basis.
  lean: The same bar calculation is used to derive the sum identity for R-polynomials.
    Lean then verifies that the constant-on-comparable-pairs P-family satisfies NormalizedKL
    and applies the proved uniqueness theorem.
  consequence: The final steps use the R-sum identity and normalized-family uniqueness
    to obtain P=1.
- id: induced-model-construction
  kind: Same model properties, different justification
  nodes:
  - kl.notes.dihedral_models
  - kl.detail.dihedral_model_properties
  - kl.local.localized_decomposition
  paper_labels:
  - loc:models
  lean_declarations:
  - OAI.KLInvariance.TitsSpace.PlaneBasis.model_flabby
  - OAI.KLInvariance.TitsSpace.PlaneBasis.model_generated
  - OAI.KLInvariance.TitsSpace.PlaneBasis.model_quotient
  paper: The induced-model lemma justifies applying the character theorem to the restricted
    reflection-faithful realization and uses the dihedral character calculation to
    identify the rank-one model.
  lean: The actual induced-label structure model is handled by orbit-spline interpolation.
    Its congruences, flow-down sections, flabbiness, global generation, and quotient
    maps are established directly before local model decomposition.
  consequence: Orbit-spline interpolation proves the model properties for the ambient
    root labels. These properties supply the inputs to the local decomposition theorem.
- id: square-parameter
  kind: Equivalent parameter conventions
  nodes:
  - kl.foundations.scaled_kl
  - kl.comparison.normalized_kernel
  - kl.comparison.edge_increment
  - kl.detail.schedule_state
  paper_labels:
  - eq:state
  - eq:step
  lean_declarations:
  - OAI.KLInvariance.scaledKL
  - OAI.KLInvariance.BruhatGraph.stateScale
  - OAI.KLInvariance.BruhatGraph.normalized_edge_increment_le
  paper: The comparison uses \(0<q<1\), scale \(q^{-d/2}(1-q)^N\), and transfer coefficient
    \(q^{-1/2}-q^{1/2}\).
  lean: The comparison uses \(0<t<1\) and substitutes \(q=t^2\). Its scale is \(t^{-d}(1-t^2)^N\)
    and its transfer coefficient is \(t^{-1}-t\).
  consequence: The substitution \(q=t^2\) identifies the two normalizations. Linear
    root labels have degree one throughout the calculation.
- id: word-versus-boundary-characters
  kind: Different intermediate objects
  nodes:
  - kl.detail.word_characters
  - kl.detail.word_character_formula
  - kl.detail.word_character_reciprocity
  paper_labels:
  - bg:normalization
  lean_declarations:
  - OAI.KLInvariance.TitsSpace.bottStalkCharacter_eq_heckeWord
  - OAI.KLInvariance.TitsSpace.bottKernelCharacter_rConvolution
  - OAI.KLInvariance.BruhatGraph.StalkCharacterObligation
  paper: The normalization discussion identifies indecomposable boundary-sheaf characters
    with KL polynomials by the cited character theorem.
  lean: The word-stalk character is proved to equal a positive Hecke-word coefficient.
    Its R-convolution is then proved before model decomposition and cancellation.
    The separate boundary-character identification is exposed as StalkCharacterObligation.
  consequence: The word formula and R-convolution describe the tensor word. A common
    decomposition into boundary models then supplies the character identities used
    in the cancellation argument.
- id: finite-linear-reflection-relations
  kind: Same relation, different calculation
  nodes:
  - kl.realization.finite_reflection_relations
  paper_labels:
  - bg:realization
  lean_declarations:
  - OAI.KLInvariance.Realization.geometric_reflection_relation
  paper: The realization lemma verifies the finite Coxeter relation on a positive-definite
    root plane and its fixed orthogonal complement.
  lean: The local theorem takes two vectors and two linear functionals with specified
    cross-evaluations. It proves the relation by an operator-power identity and separate
    even and odd Chebyshev evaluations.
  consequence: The displayed matrix recurrence expands the power calculation. Its
    even and odd vanishings match the local helper lemmas, and the common fixed space
    gives the identity on the entire ambient vector space.
- id: root-sign-construction
  kind: Explicit root-sign proof
  nodes:
  - kl.realization.simple_root_sign
  - kl.realization.faithful_actions
  paper_labels:
  - bg:realization
  lean_declarations:
  - OAI.KLInvariance.TitsSpace.action_root_nonneg_of_ascent
  - OAI.KLInvariance.TitsSpace.action_injective
  paper: The realization discussion invokes the geometric representation theorem and
    its root-sign property from the cited Coxeter theory.
  lean: The root-sign implication is proved by strong length induction. A minimal
    two-generator parabolic decomposition supplies a shorter prefix, and the alternating-root
    formula supplies nonnegative coefficients. Faithfulness follows by applying the
    descent sign to an element in the kernel.
  consequence: The entries develop the coset decomposition, coefficient formula, and
    induction before applying faithfulness. This gives the stated geometric facts
    from the local word calculations.
- id: minimal-extension-formulation
  kind: Formulation of dimension minimality
  nodes:
  - kl.realization.extension_minimality
  paper_labels:
  - bg:realization
  lean_declarations:
  - OAI.KLInvariance.Realization.extension_dimension_minimal
  paper: The realization lemma gives the lower bound for a nondegenerate extension
    and also discusses minimal dimension under independent-root and independent-coroot
    conditions.
  lean: The local dimension theorem assumes an injective form-preserving map into
    a finite-dimensional space with a nondegenerate bilinear form. It proves that
    the ambient dimension is at least the original dimension plus its radical dimension.
  consequence: The theorem here states this form-preserving extension bound. The constructed
    dual extension attains it and supplies independent embedded roots and normals.
- id: integral-support-duality
  kind: Different construction of the stalk–costalk relation
  nodes:
  - kl.detail.section_duality
  - kl.detail.costalk_duality
  - kl.sheaves.costalk_support
  - kl.sheaves.supported_stalk_duality
  paper_labels:
  - bg:normalization
  - eq:bg-upward-rank
  lean_declarations:
  - OAI.KLInvariance.IntegralSupport.supported_iff_annihilates
  - OAI.KLInvariance.BruhatGraph.FreeSheaf.kernelEquivSingleSupport
  - OAI.KLInvariance.BruhatGraph.FreeSheaf.costalkEquivDual
  paper: The normalization proof describes a lower-support layer, relates it to the
    outgoing kernel using flabbiness, and obtains its graded rank through the cited
    moment-graph and Soergel-module results. It temporarily doubles degrees and uses
    the shift convention M(k)^j = M^{j+k}.
  lean: The local construction starts with a free sheaf and a specified balanced perfect
    section pairing. Integral cuts identify vertex support with an evaluation-kernel
    annihilator. The incoming label product identifies that support module with the
    outgoing kernel, giving an explicit linear equivalence with the stalk dual.
  consequence: The Blueprint follows these integral maps. The pairing construction
    and its homogeneity equation supply the later graded reciprocity statement. Degree
    shifts use the Lean convention M(d)_n = M_{n-d}.
