  lean: The finite sum S_w has coefficient one below w. The product is S_w plus q
    times the correction vector. Lean applies the coefficient-linear bar map to the
    product formula at the inverse unit parameter and cancels the common correction
    term.
  consequence: Writing \(q=v^2\) and \(C_w^\circ=v^{-\ell(w)}S_w\) converts the two
    product formulas and bar statements directly. The explicit double-string theorem
    includes the finite longest-element case.
