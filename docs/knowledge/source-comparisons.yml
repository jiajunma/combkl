  paper: The graded-rank paragraph gives \(\operatorname{Hilb}(M;q)=\operatorname{grk}_A(M;q)/(1-q)^N\)
    for a homogeneous free basis. The comparison evaluates Hilbert series at \(0<q<1\),
    uses the factor \(1-q\) for a degree-one scalar quotient, and detects equality
    through a positive quotient deficit.
  lean: The implementation defines real integer-indexed terms from the finite ranks
    of intersections with ambient pieces. Finite homogeneous covers prove piece finiteness
    and summability. Degreewise exactness proves the scalar-quotient factor, and inclusion
    plus homogeneity of the larger subspace turns one equal positive Hilbert value
    into equality.
  consequence: The KB distinguishes the formal coefficient series, its convergent
    real value and the free-module basis-degree polynomial. The factor \((1-q)^N\)
    removes the coefficient-ring contribution; \(1-q\) records quotienting by a regular
    degree-one label.
