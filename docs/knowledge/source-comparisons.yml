authority: Lean is primary when sources differ
comparisons:
- id: character-normalization
  kind: Different intermediate statement
  nodes:
  - kl.duality.character_identity_condition
  - kl.duality.actual_character_reciprocity
  - kl.detail.costalk_reciprocity
  - kl.detail.local_diagonal_degree
  - kl.detail.local_intersection
