  - OAI.KLInvariance.TitsSpace.PlaneBasis.pairClosure_eq_planeSubgroup
  - OAI.KLInvariance.TitsSpace.PlaneBasis.system
  - OAI.KLInvariance.TitsSpace.PlaneBasis.inversion_iff
  paper: The plane lemma invokes the reflection-subgroup theorem to obtain a canonical
    Coxeter system, then uses positivity in the plane to show that its rank is two.
  lean: Finite ambient inversion sets produce angular endpoints. Their plane-simple
    sign criterion and the plane inversion count prove generation by two endpoint
    reflections through a count-decreasing conjugation. A two-involution presentation
    constructs the Coxeter system; the induced signed relation then identifies its
    inversions.
  consequence: The Blueprint follows the endpoint-existence, generation, presentation,
    and signed-inversion proofs in that order.
- id: plane-coset-identification
  kind: The graph and count statements are separated in Lean
  nodes:
  - kl.dihedral.plane_coset_graph
  paper_labels:
  - dih:plane
  lean_declarations:
  - OAI.KLInvariance.TitsSpace.planeCoset_exists_minimal
