  - OAI.KLInvariance.TitsSpace.PlaneBasis.coset_length_eq
  - OAI.KLInvariance.TitsSpace.PlaneBasis.coset_bruhat
  paper: One lemma states the unique least ambient-length representative, the coset
    reflection-graph identification, the relative inversion count, and the implication
    from relative to ambient order.
  lean: The source first proves existence of a least representative and sign preservation,
    then exports the graph, count, and path statements under that least-length hypothesis.
  consequence: The proof below uses those exported statements and derives uniqueness
    explicitly from the plane count and the length-zero characterization of the identity.
- id: graded-and-local-model-decomposition
  kind: Related descent in different coefficient settings
  nodes:
  - kl.detail.model_decomposition
  - kl.sheaves.model_sum_step
  - kl.algebra.minimal_cover_remainder
  paper_labels:
  - loc:decomposition
  lean_declarations:
  - OAI.KLInvariance.Graded.ModuleData.exists_minimalCover_split
  - OAI.KLInvariance.MomentGraph.GradedSheaf.extend_modelSum
  - OAI.KLInvariance.MomentGraph.GradedSheaf.exists_modelSumIso
  paper: The plane-localization proposition descends through a finite coset graph
    over an ungraded local ring. Nakayama makes the lifted stalk map surjective, its
    free target gives a splitting, and projectivity over the local ring makes the
    remainder free. Multiplicities count copies of local structure models.
  lean: The graded construction lifts in both directions and corrects the composite
    using invertibility modulo the positive ideal. The remainder is graded projective
    over a connected Noetherian domain and has a homogeneous basis. Its degrees determine
    nonnegative shifts of boundary models. Partial isomorphisms already include every
    edge whose upper endpoint has been processed.
  consequence: Both constructions split a stalk over the upper boundary image and
    add models centered at the new vertex. The graded construction records a polynomial
    of shifts at each center; the ungraded local construction records an integer number
    of copies.
- id: hecke-operator-construction
  kind: Algebraic construction behind the polynomial conventions
  nodes:
  - kl.hecke.word_independence
  - kl.hecke.ordinary_r_construction
  - kl.hecke.r_parameter_reciprocity
  paper_labels:
  - sec:introduction
  - bg:paths
  lean_declarations:
  - OAI.KLInvariance.HeckeQ.leftWord_independent
  - OAI.KLInvariance.HeckeQ.rValue_recursion
  - OAI.KLInvariance.OrdinaryR.rValue_polynomial
  - OAI.KLInvariance.HeckeQ.rValue_eq_dualR
  paper: The conventions specify the ordinary R descent recurrence. The reflection-order
    path theorem introduces the normalized family through path counting and states
    its square-parameter relation to ordinary R.
  lean: The regular operators are built from Coxeter length. Left/right commutation
    and the cyclic identity vector prove reduced-word independence. Inverse operators
    define R-values; their recurrence proves polynomiality, and a second matching-recurrence
    argument proves signed parameter reciprocity.
  consequence: The KB develops these algebraic constructions before the geometric
    path formula. The recurrence and inverse-parameter coefficient identities used
    by the character argument follow from the constructed operators.
- id: canonical-lower-half-construction
  kind: Explicit construction of the normalized family
  nodes:
  - kl.foundations.canonical_kl
  - kl.detail.kl_recursion
  - kl.hecke.normalization_unique
  paper_labels:
  - sec:introduction
  - eq:reciprocity
  lean_declarations:
  - OAI.KLInvariance.CanonicalP.polynomial
  - OAI.KLInvariance.CanonicalP.polynomial_reciprocity
  - OAI.KLInvariance.normalizedKL_unique
  - OAI.KLInvariance.constructed_normalizedKL
  - OAI.KLInvariance.klFamilies_eq_constructed
  paper: The conventions specify the ordinary R recurrence, the strict P degree bound
    and reciprocity, referring to the classical Kazhdan–Lusztig normalization.
  lean: After constructing R, the development defines P by the negative lower half
    of the proper-upper defect. The reversed R-kernel proves that defect anti-reciprocal,
    yielding reciprocity. Separate uniqueness inductions identify the selected family
    with the construction.
  consequence: The KB presents the coefficient solution, defect identity, rank induction
    and seven normalization fields as a continuous construction. The classical selection
    interfaces are then identified with the explicit formulas.
- id: dihedral-product-normalization
  kind: The same string calculation in two normalizations
  nodes:
  - kl.hecke.dihedral_sum_product
  - kl.hecke.dihedral_bar_sum
  paper_labels:
  - loc:dihedral-product
  - loc:dihedral-kl
  lean_declarations:
  - OAI.KLInvariance.Dihedral.double_string
  - OAI.KLInvariance.Dihedral.lowerSum_product
  - OAI.KLInvariance.Dihedral.bar_lowerSum_alt
  paper: The notes use \(C_w^\circ=q^{-\ell(w)/2}S_w\). Their product has a zero correction
    at length two and the shorter-prefix vector at longer lengths; induction proves
    semilinear bar invariance.
  lean: The finite sum S_w has coefficient one below w. The product is S_w plus q
    times the correction vector. Lean applies the coefficient-linear bar map to the
    product formula at the inverse unit parameter and cancels the common correction
    term.
  consequence: Writing \(q=v^2\) and \(C_w^\circ=v^{-\ell(w)}S_w\) converts the two
    product formulas and bar statements directly. The explicit double-string theorem
    includes the finite longest-element case.
- id: interval-rank-prerequisites
  kind: Explicit order-theoretic prerequisites
  nodes:
  - kl.coxeter.interval_restriction
  - kl.coxeter.bruhat_successor
  - kl.foundations.rank_preservation
  paper_labels:
  - sec:introduction
  - sec:induction
  lean_declarations:
  - OAI.KLInvariance.intervalIso_restrict
  - OAI.KLInvariance.exists_bruhat_successor
  - OAI.KLInvariance.rankDifference_le_of_strictMono
  - OAI.KLInvariance.intervalIso_rankDifference
  paper: The introduction describes Bruhat intervals as finite graded posets. The
    comparison induction restricts its isomorphism to smaller upper intervals and
    uses the equal relative ranks to normalize both vectors.
  lean: Subinterval restriction is constructed on the underlying interval elements.
    A simple-descent induction gives a length-one successor; rank induction shows
    that a strictly monotone map cannot decrease rank. Applying it to an isomorphism
    and its inverse proves rank preservation.
  consequence: These lemmas justify both the smaller induction instances and the common
    powers used when transporting interval-indexed vectors.
