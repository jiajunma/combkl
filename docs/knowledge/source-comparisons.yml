  lean: Subinterval restriction is constructed on the underlying interval elements.
    A simple-descent induction gives a length-one successor; rank induction shows
    that a strictly monotone map cannot decrease rank. Applying it to an isomorphism
    and its inverse proves rank preservation.
  consequence: These lemmas justify both the smaller induction instances and the common
    powers used when transporting interval-indexed vectors.
