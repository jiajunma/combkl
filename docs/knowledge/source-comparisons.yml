  - OAI.KLInvariance.TitsSpace.bottKernelCharacter_rConvolution
  - OAI.KLInvariance.BruhatGraph.StalkCharacterObligation
  paper: The normalization discussion identifies indecomposable boundary-sheaf characters
    with KL polynomials by the cited character theorem.
  lean: The word-stalk character is proved to equal a positive Hecke-word coefficient.
    Its R-convolution is then proved before model decomposition and cancellation.
    The separate boundary-character identification is exposed as StalkCharacterObligation.
  consequence: The word formula and R-convolution describe the tensor word. A common
    decomposition into boundary models then supplies the character identities used
    in the cancellation argument.
- id: finite-linear-reflection-relations
  kind: Same relation, different calculation
  nodes:
  - kl.realization.finite_reflection_relations
  paper_labels:
  - bg:realization
  lean_declarations:
  - OAI.KLInvariance.Realization.geometric_reflection_relation
  paper: The realization lemma verifies the finite Coxeter relation on a positive-definite
    root plane and its fixed orthogonal complement.
  lean: The local theorem takes two vectors and two linear functionals with specified
    cross-evaluations. It proves the relation by an operator-power identity and separate
    even and odd Chebyshev evaluations.
  consequence: The displayed matrix recurrence expands the power calculation. Its
    even and odd vanishings match the local helper lemmas, and the common fixed space
    gives the identity on the entire ambient vector space.
- id: root-sign-construction
  kind: Explicit root-sign proof
  nodes:
  - kl.realization.simple_root_sign
  - kl.realization.faithful_actions
  paper_labels:
  - bg:realization
  lean_declarations:
  - OAI.KLInvariance.TitsSpace.action_root_nonneg_of_ascent
  - OAI.KLInvariance.TitsSpace.action_injective
  paper: The realization discussion invokes the geometric representation theorem and
    its root-sign property from the cited Coxeter theory.
  lean: The root-sign implication is proved by strong length induction. A minimal
    two-generator parabolic decomposition supplies a shorter prefix, and the alternating-root
    formula supplies nonnegative coefficients. Faithfulness follows by applying the
    descent sign to an element in the kernel.
  consequence: The entries develop the coset decomposition, coefficient formula, and
    induction before applying faithfulness. This gives the stated geometric facts
    from the local word calculations.
- id: minimal-extension-formulation
  kind: Formulation of dimension minimality
  nodes:
  - kl.realization.extension_minimality
  paper_labels:
  - bg:realization
  lean_declarations:
  - OAI.KLInvariance.Realization.extension_dimension_minimal
  paper: The realization lemma gives the lower bound for a nondegenerate extension
    and also discusses minimal dimension under independent-root and independent-coroot
    conditions.
  lean: The local dimension theorem assumes an injective form-preserving map into
    a finite-dimensional space with a nondegenerate bilinear form. It proves that
    the ambient dimension is at least the original dimension plus its radical dimension.
  consequence: The theorem here states this form-preserving extension bound. The constructed
    dual extension attains it and supplies independent embedded roots and normals.
- id: integral-support-duality
  kind: Different construction of the stalk–costalk relation
  nodes:
  - kl.detail.section_duality
  - kl.detail.costalk_duality
  - kl.sheaves.costalk_support
  - kl.sheaves.supported_stalk_duality
  paper_labels:
  - bg:normalization
  - eq:bg-upward-rank
  lean_declarations:
  - OAI.KLInvariance.IntegralSupport.supported_iff_annihilates
  - OAI.KLInvariance.BruhatGraph.FreeSheaf.kernelEquivSingleSupport
  - OAI.KLInvariance.BruhatGraph.FreeSheaf.costalkEquivDual
  paper: The normalization proof describes a lower-support layer, relates it to the
    outgoing kernel using flabbiness, and obtains its graded rank through the cited
    moment-graph and Soergel-module results. It temporarily doubles degrees and uses
    the shift convention M(k)^j = M^{j+k}.
  lean: The local construction starts with a free sheaf and a specified balanced perfect
    section pairing. Integral cuts identify vertex support with an evaluation-kernel
    annihilator. The incoming label product identifies that support module with the
    outgoing kernel, giving an explicit linear equivalence with the stalk dual.
  consequence: The Blueprint follows these integral maps. The pairing construction
    and its homogeneity equation supply the later graded reciprocity statement. Degree
    shifts use the Lean convention M(d)_n = M_{n-d}.
- id: boundary-pairing-construction
  kind: Different construction of the boundary duality
  nodes:
  - kl.detail.boundary_pairing
  paper_labels:
  - bg:normalization
  lean_declarations:
  - OAI.KLInvariance.TitsSpace.bottAdjointSheaf
  - OAI.KLInvariance.TitsSpace.bottCanonicalAdjointIso
  - OAI.KLInvariance.TitsSpace.bottCanonicalPerfectPairing_apply
  - OAI.KLInvariance.BruhatGraph.boundarySheaf_symmetricPairing
  paper: The normalization proof uses the normalized self-dual projective and the
    cited moment-graph/Soergel equivalence to relate the stalk and lower-support layer,
    before translating grading conventions.
  lean: The word pairing is constructed by tensor induction. Supported weight submodules
    prove adjoint kernel preservation, which descends the adjoint to a graded sheaf
    map. The adjoint image is dual to the original boundary summand; primitive recognition
    and the canonical comparison isomorphism produce its perfect symmetric pairing.
  consequence: The proof follows the integral adjoint, image-section duality, primitive
    recognition, and canonical-comparison maps. The trace lowers degree once per word
    letter. Coefficient transport and a boundary-recognition isomorphism deliver the
    pairing on the chosen polynomial-coordinate sheaf.
- id: plane-subgroup-construction
  kind: Same plane subgroup, different construction
  nodes:
