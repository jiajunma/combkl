name: Build and publish blueprint

on:
  push:
    branches: [main, codex/kl-source-snapshot]
    paths:
      - docs/knowledge/**
      - scripts/**
      - sources/**
      - .github/workflows/blueprint-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out blueprint sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out the pinned mdblueprint implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gametheoryinlean/mdblueprint
          ref: dd0743a94b709220f9411964a781da6b2fc61d5b
          path: build/mdblueprint
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install documentation dependencies
        run: |
          python -m pip install ./build/mdblueprint
          npm install --prefix build/document-tools --ignore-scripts --no-audit --no-fund --save-exact katex@0.16.46
      - name: Check navigation and completed-proof metadata
        env:
          PYTHONPATH: build/mdblueprint
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build and validate the entire blueprint
        run: python scripts/build_knowledge.py --mdblueprint build/mdblueprint --katex-module build/document-tools/node_modules/katex
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the built website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/knowledge

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
